services:
  app:
    container_name: dockpoly-engine
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "${PORT:-80}:${PORT:-80}"
      - "443:443"
    environment:
      - PORT=${PORT:-80}
      - MANAGEMENT_PORT=${MANAGEMENT_PORT:-3000}
      - MANAGEMENT_HOST=${MANAGEMENT_HOST:-127.0.0.1}
      - DOMAIN=${DOMAIN:-localhost}
      - DOCKER_NETWORK=${DOCKER_NETWORK:-deploy-engine}
      - NODE_ENV=${NODE_ENV:-production}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./public:/app/public
    networks:
      - deploy-engine
    restart: unless-stopped
    init: true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:${MANAGEMENT_PORT:-3000}/app || wget -q --spider http://127.0.0.1:${PORT:-4000}/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  deploy-engine:
    name: ${DOCKER_NETWORK:-deploy-engine}
    driver: bridge
