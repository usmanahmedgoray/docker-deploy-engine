<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="nexaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="cubeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Hexagon -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#nexaGrad)" filter="url(#glow)" />
  
  <!-- Inner Glass Overlay -->
  <rect x="6" y="6" width="52" height="52" rx="14" fill="#080a10" fill-opacity="0.25" />

  <!-- NexaDock 3D Hex-Cube Emblem -->
  <path d="M32 14 L48 23 V41 L32 50 L16 41 V23 Z" fill="none" stroke="url(#cubeGrad)" stroke-width="3" stroke-linejoin="round" />
  <path d="M32 14 V32 L48 41" fill="none" stroke="url(#cubeGrad)" stroke-width="2.5" stroke-linejoin="round" />
  <path d="M32 32 L16 41" fill="none" stroke="url(#cubeGrad)" stroke-width="2.5" stroke-linejoin="round" />
  
  <!-- Glowing Center Node -->
  <circle cx="32" cy="32" r="4" fill="#06b6d4" />
</svg>
